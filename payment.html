<!DOCTYPE html>
<html>

<head>

<title>Violation Payment</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h3 class="mb-3">Traffic Violation Payment</h3>

<hr>

<p><b>Vehicle Number:</b> {{record.vehicle_number}}</p>

<p><b>Violation:</b> {{record.violation_type}}</p>

<p><b>Location:</b> {{record.location}}</p>

<p><b>Date:</b> {{record.date}}</p>

<h4 class="text-danger">Fine Amount: ₹{{record.fine_amount}}</h4>

<hr>

<h5>Scan QR to Pay</h5>

<img src="/static/qr/{{record.id}}.png" width="200">

<br><br>

<a href="/confirm_payment/{{record.id}}" class="btn btn-success">
Confirm Payment
</a>

<a href="/history" class="btn btn-secondary">
Back
</a>

</div>

</div>

</body>

</html>
