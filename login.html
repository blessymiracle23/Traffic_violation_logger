<!DOCTYPE html>
<html>
<head>

<title>Admin Login</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
background:#eef2ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Segoe UI;
}

.login-card{
background:white;
padding:40px;
border-radius:12px;
width:350px;
box-shadow:0 4px 20px rgba(0,0,0,0.1);
border-top:6px solid #4f46e5;
}

.title{
text-align:center;
color:#4f46e5;
margin-bottom:25px;
}

.btn-login{
background:#4f46e5;
color:white;
}

.btn-login:hover{
background:#3730a3;
}

</style>

</head>

<body>

<div class="login-card">

<h4 class="title">Traffic Admin Login</h4>

<form method="POST">

<div class="mb-3">
<label>Username</label>
<input type="text" name="username" class="form-control" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" name="password" class="form-control" required>
</div>

<div class="d-grid">
<button class="btn btn-login">Login</button>
</div>

</form>

</div>

</body>
</html>
